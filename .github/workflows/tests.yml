name: Workstation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m pip install -r requirements-era5.txt
      - run: python check.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q arktika server.py
      - run: python scripts/manifest.py --check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-era5.txt 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - run: node --check static/app.js && node --check static/studio.js && node --check static/catalog.js && node --check static/product_flow.js && node --check static/era5.js
      - run: python scripts/browser_smoke.py --output browser-results
      - run: python scripts/catalog_browser_smoke.py --output browser-results/catalog
      - run: python scripts/archive_browser_smoke.py --output browser-results/archive
      - run: python scripts/product_browser_smoke.py --output browser-results/products
      - run: python scripts/era5_browser_smoke.py --output browser-results/era5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: browser-results
          retention-days: 7
