name: Проверки
on:
  push:
    paths:
      - "arktika/**"
      - "static/**"
      - "tests/**"
      - "scripts/**"
      - "server.py"
      - "requirements*.txt"
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - run: python check.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q arktika server.py
      - run: node --check static/app.js
      - run: node --check static/studio.js
  browser:
    name: Chromium / HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-flow-checks
          path: browser-results/
