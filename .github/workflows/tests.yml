name: Workstation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coefficients:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Download official coefficient table without RTTOV
        run: python scripts/check_coefficients.py --output coefficient-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coefficient-download-check
          path: coefficient-check.json
          retention-days: 7
  era5-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Install ERA5 through the same managed installer as the UI
        run: python scripts/setup_era5.py --state-dir "${{ runner.temp }}/arktika-era5-setup"
      - name: Reuse verified runtime without reinstalling
        run: python scripts/setup_era5.py --state-dir "${{ runner.temp }}/arktika-era5-setup"
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m pip install -r requirements-era5.txt
      - run: python check.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q arktika server.py
      - run: python scripts/manifest.py --check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-era5.txt 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - run: node --check static/app.js && node --check static/studio.js && node --check static/catalog.js && node --check static/product_flow.js && node --check static/era5.js && node --check static/reanalysis.js
      - run: python scripts/browser_smoke.py --output browser-results
      - run: python scripts/catalog_browser_smoke.py --output browser-results/catalog
      - run: python scripts/archive_browser_smoke.py --output browser-results/archive
      - run: python scripts/product_browser_smoke.py --output browser-results/products
      - run: python scripts/era5_browser_smoke.py --output browser-results/era5
      - run: python scripts/reanalysis_browser_smoke.py --output browser-results/reanalysis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: browser-results
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release.py --output dist --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/
          retention-days: 14
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'f2re/arktika-worker'
    needs: [python, era5-install, browser, coefficients, package]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release.py --output dist --commit "${{ github.sha }}"
      - name: Publish the tested commit and verified archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(python -c 'import json; print(json.load(open("dist/build-info.json"))["tag"])')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing is overwritten."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          fi
          cp dist/RELEASE_NOTES.md "$RUNNER_TEMP/release-notes.md"
          printf '\nПроверенный коммит: `%s`. [Журнал CI](https://github.com/%s/actions/runs/%s).\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" dist/*.zip dist/SHA256SUMS.txt dist/build-info.json dist/RELEASE_NOTES.md \
            --target "$GITHUB_SHA" --title "Арктика-М $tag — поля реанализа и карта" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
