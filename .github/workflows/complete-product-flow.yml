name: Complete reviewed product sources
on:
  push:
    branches: [fix/product-flow-finish]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'f2re/arktika-worker' && github.ref == 'refs/heads/fix/product-flow-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - run: python .delivery/complete_product.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q arktika server.py
      - run: node --check static/product_flow.js && node --check static/studio.js && node --check static/catalog.js
      - run: python scripts/manifest.py --check
      - name: Commit reviewed sources to the same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Implement product-first workflow and scoped radiometric scales'
          git push origin HEAD:refs/heads/fix/product-flow-finish
