name: Import audited source
on:
  push:
    branches: [fix/audit-release-0.2.2]
    paths: [.github/workflows/import-source.yml, .delivery/READY.json]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify transport and reconstruct source
        id: source
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          ready = root / '.delivery/READY.json'
          if not ready.exists():
              print('Transport prepared; no payload submitted yet.')
          else:
              ref = '5db6fddbd9b395fdbd700c8aa6deb89919137104'
              encoded = ''.join(subprocess.check_output(['git','show',f'{ref}:.delivery/part-{i:02d}.txt']).decode().strip() for i in range(8))
              text = lzma.LZMADecompressor().decompress(base64.b64decode(encoded)).decode('utf-8',errors='ignore')
              decoder=json.JSONDecoder(); pos=text.index('{')+1; base={}
              while True:
                  while pos<len(text) and text[pos] in ' \r\n\t,': pos+=1
                  try:
                      name,pos=decoder.raw_decode(text,pos)
                      while text[pos] in ' \r\n\t:': pos+=1
                      content,pos=decoder.raw_decode(text,pos)
                  except (ValueError,IndexError): break
                  assert isinstance(name,str) and isinstance(content,str)
                  base[name]=content
              spec=json.loads(ready.read_text())
              encoded=''.join((root/'.delivery'/name).read_text().strip() for name in spec['parts'])
              packed=base64.b64decode(encoded,validate=True)
              assert hashlib.sha256(packed).hexdigest()==spec['sha256'], 'Transport checksum mismatch'
              delta=json.loads(lzma.decompress(packed))
              files={n:base[n] for n in delta['keep'] if n in base}
              files.update(delta['new'])
              for name,entry in delta['edits'].items():
                  assert hashlib.sha256(base[name].encode()).hexdigest()==entry['base_sha256'], name
                  lines=base[name].splitlines(keepends=True)
                  for i,j,value in reversed(entry['changes']): lines[i:j]=[value]
                  files[name]=''.join(lines)
              assert set(files)==set(delta['keep']) and len(files)==spec['file_count']
              for name,content in files.items():
                  rel=pathlib.PurePosixPath(name)
                  assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts
                  assert not name.startswith(('.delivery/','.github/workflows/'))
                  target=root/rel; target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(content.encode('utf-8'))
              assert hashlib.sha256((root/'MANIFEST.json').read_bytes()).hexdigest()==spec['manifest_sha256']
              with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('ready=true\n')
              print('Recovered',len(base),'base files; reconstructed',len(files),'source files')
      - name: Build-only dependencies
        if: steps.source.outputs.ready == 'true'
        run: python -m pip install --only-binary=:all: pyogrio==0.12.1 shapely==2.1.2 mistune==3.2.1
      - name: Reproduce derived source assets and verify entire manifest
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          python scripts/build_basemap.py
          python scripts/build_docs.py
          python scripts/manifest.py --check
          python -m compileall -q arktika server.py
      - name: Commit plaintext source to audit branch
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          rm -rf .delivery
          chmod +x start.sh install.sh start.command
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Опубликовать рабочее место Арктика-М 0.2.2 после аудита'
          git push origin HEAD:fix/audit-release-0.2.2
