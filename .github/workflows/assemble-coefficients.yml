name: Assemble reviewed coefficient fix
on:
  push:
    branches: [fix/coefficients-autodownload-20260927]
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'f2re/arktika-worker' && github.event.head_commit.message == 'Stage reviewed coefficient download fix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply checksum-verified source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '46b21f39f7a612144ed61971b5b425d8811475f6'
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          text = Path('.delivery/coefficients.b64').read_text(encoding='ascii')
          patch = lzma.decompress(base64.b64decode(text, validate=True))
          if len(patch) != 42697 or hashlib.sha256(patch).hexdigest() != 'cc512b386ede562a77406448a99ba543cf4772e1f85bd7190c0ce52f32795a9d':
              raise SystemExit('Reviewed patch checksum mismatch')
          (Path(os.environ['RUNNER_TEMP']) / 'reviewed.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero "$RUNNER_TEMP/reviewed.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/reviewed.patch"
          git add -A
          cp .git/index "$RUNNER_TEMP/checked.index"
          GIT_INDEX_FILE="$RUNNER_TEMP/checked.index" git update-index --force-remove .delivery/coefficients.b64 .github/workflows/assemble-coefficients.yml
          test "$(GIT_INDEX_FILE="$RUNNER_TEMP/checked.index" git write-tree)" = '7c874e4c52cc860572e16f887f4c2ee5b11440c7'
          python3 scripts/manifest.py --check
          python3 -m compileall -q arktika scripts server.py
          for file in static/*.js; do node --check "$file"; done
          git diff --cached --exit-code -- .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix automatic coefficient download independent of RTTOV'
          git push origin HEAD:refs/heads/fix/coefficients-autodownload-20260927
