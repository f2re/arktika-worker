name: Assemble reviewed ERA5 flow
on:
  push:
    branches: [publish/era5-flow-20260927]
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'f2re/arktika-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and apply reviewed source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '3d27e36de36af4cfe1c8828d0db3513aec321ca4'
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          text = ''.join(Path(f'.delivery/flow-{i}.b64').read_text(encoding='ascii') for i in range(1, 5))
          patch = lzma.decompress(base64.b64decode(text, validate=True))
          if len(patch) != 159238 or hashlib.sha256(patch).hexdigest() != 'ae880a846c83c7f088cf0ffdf8c157b2fa490074793aca34540f599f9b4f547c':
              raise SystemExit('Reviewed patch checksum mismatch')
          (Path(os.environ['RUNNER_TEMP']) / 'reviewed.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero "$RUNNER_TEMP/reviewed.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/reviewed.patch"
          git rm -- .delivery/flow-1.b64 .delivery/flow-2.b64 .delivery/flow-3.b64 .delivery/flow-4.b64 .github/workflows/assemble-era5-flow.yml
          git add -A
          test "$(git write-tree)" = '01b11a0ebc75c25c24d7eee1b3b594d09d3a64c4'
          python3 scripts/manifest.py --check
          python3 -m compileall -q arktika scripts server.py
          for file in static/*.js; do node --check "$file"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ERA5: автоматическая подготовка, каналы, статусы и интерфейс'
          git push origin HEAD:refs/heads/publish/era5-flow-20260927
