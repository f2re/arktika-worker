name: Deliver verified release source
on:
  push:
    branches: [publish/reanalysis-v0.3.0-20260930]
    paths: [.github/workflows/deliver-release-source.yml]
permissions:
  contents: write
jobs:
  deliver:
    if: github.repository == 'f2re/arktika-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'mistune==3.2.1'
      - name: Reconstruct and verify the reviewed source tree
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import subprocess
          from pathlib import Path, PurePosixPath

          base = '3794de8135730f9f80d7452b7ec9cba787bd5ab5'
          branch = 'release/reanalysis-v0.3.0'
          expected_tree = '484bd8587af9370bddd635fbe9790a265b9fe859'
          expected_recipe = '14fcc82de10aa56ff5f03a2a27d6c4a5d2c18d1e32138395aeca648cf764c6d1'
          chunks = [
              'bcaf9f1c012f238be5683011e831da088bc86823',
              '343e15acaccd27f58e0c9d7c10d0bb7352da8af7',
              '3ca37b3a58d8afa962e2284c7659486456644e31',
              '6e1d16c554954a55844960276b775ee0e8cbb7ee',
          ]
          compressed = bytearray()
          for sha in chunks:
              result = json.loads(subprocess.check_output(
                  ['gh', 'api', 'repos/f2re/arktika-worker/git/blobs/' + sha]))
              part = base64.b64decode(result['content'])
              actual = hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest()
              if actual != sha:
                  raise SystemExit('Git blob checksum mismatch')
              compressed.extend(part)
          raw = lzma.decompress(compressed, memlimit=268435456)
          if hashlib.sha256(raw).hexdigest() != expected_recipe:
              raise SystemExit('Source recipe checksum mismatch')
          recipe = json.loads(raw)
          root = Path(os.environ['RUNNER_TEMP']) / 'verified-release-source'
          subprocess.run(['git', 'worktree', 'add', '--detach', str(root), base], check=True)

          def safe_path(name):
              p = PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts or '\\' in name or not p.parts:
                  raise SystemExit('Unsafe source path')
              if p.parts[0] in ('.git', '.github'):
                  raise SystemExit('Workflow or Git mutation is not part of this delivery')
              target = root.joinpath(*p.parts)
              if target.is_symlink():
                  raise SystemExit('Unexpected symbolic link')
              return target

          for name, edits in recipe['edits'].items():
              target = safe_path(name)
              old = target.read_text(encoding='utf-8').splitlines(keepends=True) if target.exists() else []
              size = len(old)
              previous = size
              for start, end, replacement in reversed(edits):
                  if not 0 <= start <= end <= previous or end > size:
                      raise SystemExit('Invalid edit ranges')
                  old[start:end] = replacement.splitlines(keepends=True)
                  previous = start
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(''.join(old), encoding='utf-8')
          for name in recipe['delete']:
              safe_path(name).unlink()
          for script in ('scripts/build_docs.py', 'scripts/manifest.py'):
              subprocess.run(['python', script], cwd=root, check=True)

          # The CI workflow is written separately through the authorized connector.
          # Keep it unchanged here; prepare the manifest for that exact second step.
          workflow = '.github/workflows/tests.yml'
          if hashlib.sha256((root/workflow).read_bytes()).hexdigest() != 'a64ee7a90a7e92511e54e4be2a168a0326e23ffaa882890085c6c67965e51fb4':
              raise SystemExit('Base CI workflow changed')
          manifest_path = root/'MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['files'][workflow] = 'be83bd5bb6f63b6c9a91ce3299a0cb74776bccf3b66c3c3a252854d3d31ba20c'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          for name, sha in manifest['files'].items():
              if name != workflow and hashlib.sha256((root/name).read_bytes()).hexdigest() != sha:
                  raise SystemExit('Manifest mismatch: '+name)
          subprocess.run(['git', 'add', '--all'], cwd=root, check=True)
          tree = subprocess.check_output(['git', 'write-tree'], cwd=root, text=True).strip()
          if tree != expected_tree:
              raise SystemExit('Unexpected reconstructed tree: '+tree)
          existing = subprocess.check_output(['git', 'ls-remote', '--heads', 'origin', branch], cwd=root, text=True)
          if existing.strip():
              raise SystemExit('Release branch already exists; refusing to overwrite')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], cwd=root, check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], cwd=root, check=True)
          subprocess.run(['git', 'commit', '-m', 'Реанализ 0.3.0: согласовать архив, исправления main и сборку релиза'], cwd=root, check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/'+branch], cwd=root, check=True)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()
          print(json.dumps({'branch':branch, 'commit':sha, 'tree':tree, 'pending':'native CI workflow write'}, ensure_ascii=False))
          PY
