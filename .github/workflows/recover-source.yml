name: Recover prior source transport
on:
  push:
    branches: [fix/audit-release-0.2.2]
    paths: [.github/workflows/recover-source.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover complete JSON entries only
        shell: python
        run: |
          import subprocess, base64, lzma, json, pathlib, hashlib
          ref = '5db6fddbd9b395fdbd700c8aa6deb89919137104'
          encoded = ''.join(subprocess.check_output(['git','show',f'{ref}:.delivery/part-{i:02d}.txt']).decode().strip() for i in range(8))
          raw = lzma.LZMADecompressor().decompress(base64.b64decode(encoded))
          text = raw.decode('utf-8', errors='ignore')
          decoder = json.JSONDecoder(); pos = text.index('{')+1; files = {}
          while True:
              while pos < len(text) and text[pos] in ' \r\n\t,': pos += 1
              try:
                  name, end = decoder.raw_decode(text, pos)
                  pos = end
                  while text[pos] in ' \r\n\t:': pos += 1
                  content, pos = decoder.raw_decode(text, pos)
              except (ValueError, IndexError): break
              if not isinstance(name,str) or not isinstance(content,str): break
              rel = pathlib.PurePosixPath(name)
              assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts
              files[name] = content
          root=pathlib.Path('recovered'); root.mkdir()
          (root/'files.json').write_text(json.dumps(files,ensure_ascii=False),encoding='utf-8')
          (root/'index.json').write_text(json.dumps({n:hashlib.sha256(c.encode()).hexdigest() for n,c in files.items()},indent=2))
          print('Recovered complete files:',len(files),'from',len(raw),'decompressed bytes')
          print('\n'.join(files))
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-source
          path: recovered
          retention-days: 1
